{% extends "base.html" %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenedor %}container{% endblock %}
{% block contenido %}
<div class="login-wrap card p-4">
  <h4 class="mb-3"><i class="bi bi-key"></i> Cambiar contraseña</h4>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Contraseña actual</label>
      <input class="form-control" type="password" name="actual" required></div>
    <div class="mb-3"><label class="form-label">Nueva contraseña</label>
      <input class="form-control" type="password" name="nueva" required minlength="8">
      <div class="form-text">Mínimo 8 caracteres con mayúscula, minúscula, número y carácter especial.</div></div>
    <div class="mb-3"><label class="form-label">Repite la nueva contraseña</label>
      <input class="form-control" type="password" name="nueva2" required></div>
    <button class="btn btn-primary w-100">Guardar</button>
  </form>
</div>
{% endblock %}
