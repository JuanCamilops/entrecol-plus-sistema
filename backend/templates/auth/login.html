{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenedor %}container{% endblock %}
{% block contenido %}
<div class="login-wrap card p-4">
  <h4 class="mb-1"><i class="bi bi-shield-lock"></i> Iniciar sesión</h4>
  <p class="text-muted small mb-4">Usuario, contraseña y captcha.</p>
  <form method="post" autocomplete="off">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Usuario</label>
      <input class="form-control" name="username" value="{{ username or '' }}" required autofocus maxlength="50"></div>
    <div class="mb-3"><label class="form-label">Contraseña</label>
      <input class="form-control" type="password" name="password" required maxlength="128"></div>
    {% include "_captcha.html" %}
    <button class="btn btn-primary w-100">Ingresar</button>
  </form>
  <p class="text-center small mt-3 mb-0">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Regístrate</a></p>
</div>
{% endblock %}
